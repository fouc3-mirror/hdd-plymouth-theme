# 安装到: /etc/systemd/system/plymouth-quit.service.d/plymouth-quit-wait.conf
# 配套脚本: /usr/local/bin/plymouth-quit-wait.sh
#
# 作用: 让 plymouth 至少等到「动画播完一轮」再退出（不推迟系统启动本身）。
#
# 注意: 这里**不能**写内联 shell —— systemd 会把 `%Y` / `%s`（stat 与 date 的
#       格式符）当成 unit specifier 展开，命令会被改写，延迟静默失效。
#       所以逻辑放在独立脚本里调用。
#
# 停用: sudo ./install.sh --uninstall
#       （或删掉本文件后 sudo systemctl daemon-reload）

[Service]
ExecStartPre=/usr/local/bin/plymouth-quit-wait.sh
